# PURL configuration for http://purl.obolibrary.org/obo/oeto

idspace: OETO
base_url: /obo/oeto

products:
- oeto.owl: https://raw.githubusercontent.com/OpenEnergyPlatform/open-energy-tasks-ontology/production/oeto.owl
- oeto.obo: https://raw.githubusercontent.com/OpenEnergyPlatform/open-energy-tasks-ontology/production/oeto.obo

term_browser: ontobee
example_terms:
- OETO_0000000

entries:

- prefix: /releases/
  replacement: https://raw.githubusercontent.com/OpenEnergyPlatform/open-energy-tasks-ontology/v

- prefix: /tracker/
  replacement: https://github.com/OpenEnergyPlatform/open-energy-tasks-ontology/issues

- prefix: /about/
  replacement: http://www.ontobee.org/ontology/OETO?iri=http://purl.obolibrary.org/obo/

## generic fall-through, serve direct from github by default
- prefix: /
  replacement: https://raw.githubusercontent.com/OpenEnergyPlatform/open-energy-tasks-ontology/production/

